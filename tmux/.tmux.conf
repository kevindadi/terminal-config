# ===========================================================================
#  ~/terminal dotfiles — tmux 配置 (gruvbox 风格)
#  软链接: ~/.tmux.conf -> ~/terminal/tmux/.tmux.conf
#  重载:   tmux 内按 前缀键(C-b) + r
# ===========================================================================

# ---- 基础 ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"            # 真彩色
set -g set-clipboard on                        # OSC52 复制到本地剪贴板
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g display-time 2000

# ---- 快捷键 ----
bind r source-file ~/.tmux.conf \; display "✔ 配置已重载"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- 状态栏 (gruvbox) ----
set -g status-position bottom
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bg=#458588,fg=#282828,bold] #S #[bg=#3c3836,fg=#458588,nobold]"
set -g status-right-length 80
set -g status-right "#[fg=#8ec07c]#{b:pane_current_path} #[fg=#665c54]| #[fg=#fabd2f]%H:%M #[fg=#665c54]| #[fg=#a89984]%Y-%m-%d "
set -g window-status-format " #[fg=#a89984]#I:#W "
set -g window-status-current-format "#[bg=#d79921,fg=#282828,bold] #I:#W "
set -g window-status-current-style "bg=#d79921,fg=#282828"
set -g window-status-activity-style "fg=#fb4934"

# ---- 边框 / 消息 ----
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#458588,fg=#fbf1c7"
set -g message-command-style "bg=#458588,fg=#fbf1c7"
setw -g mode-style "bg=#d79921,fg=#282828"
setw -g clock-mode-colour "#fabd2f"
